name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-decision.mjs

  release:
    needs: decide
    # manifest.json's version only publishes from main, and only when no
    # release for it exists yet; a workflow_dispatch on any other ref (e.g.
    # dev, where manifest.json can hold an unreleased version) only runs
    # the decide job above and never reaches this job.
    if: needs.decide.outputs.should_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run validate -- --tag "$VERSION"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "main.js, manifest.json, styles.css"
      # Tag only after lint/typecheck/test/build/validate/attest pass. The
      # decision above only checks for an existing *release*, not a tag, so
      # if this step's tag push succeeds but a later step (release create,
      # asset check) fails, the next push sees the tag already exists with
      # no release and fails loudly here instead of silently skipping -
      # delete the orphan tag and re-push main to retry.
      - name: Tag release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release PR's description is the release notes (dev -> main
          # release PRs are written that way); prepend it to the generated
          # commit list. Falls back to generated notes alone when this push
          # didn't come from a merged PR (e.g. workflow_dispatch).
          pr_body=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].body // empty' || true)
          if [ -n "$pr_body" ]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$pr_body" \
              --generate-notes \
              main.js manifest.json styles.css
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-release.mjs --check-release-assets "$VERSION"
